[project]
name = "sor-api"
version = "0.1.0"
description = "Reading Helper API (FastAPI)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "alembic>=1.20.1",
  "sqlalchemy>=2",
  "psycopg[binary]>=3.2",
  "pgvector>=0.5.1",
  "pyjwt[crypto]>=2.15.1",
  "python-multipart>=0.0.34",
  "presidio-analyzer>=2.2",
  "presidio-anonymizer>=2.2",
  "fastembed>=0.4",
  "boto3>=1.35",
  "pyyaml>=6",
  "en-core-web-sm",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest-asyncio>=0.24",
    "boto3-stubs>=1.35",
    "types-pyyaml>=6.0.12.20261113",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S106"]
"migrations/*" = ["E501", "S608"]
"app/retrieval.py" = ["S608"]  # SQL built only from constants; values are bound parameters

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = [".", ".."]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", ".."]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
