# Curated sources for the SoR Assistant (Reading Helper)
# Checked 2026-11-19. Every entry still goes through the admin review queue
# (a human attaches the license snapshot and clicks Approve).
#
# status:
#   ready           – license confirmed open (public domain / OGL / CC BY). Human approval only.
#   verify          – almost certainly fine, but no license statement found in the document itself.
#   permission      – excellent content, but rights reserved. Ask the publisher/authors first.
#   quote_only      – CC BY-NC-ND. Needs the team's no-derivatives decision.
# jurisdiction lets answers say "U.S. federal guidance" vs "UK government guidance".

sources:

